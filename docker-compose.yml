services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - chroma:/data/chroma
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma:
